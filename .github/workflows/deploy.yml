name: Build Vite and Deploy to Aliyun ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: crpi-zpvonb2nha7j0qgy.cn-shenzhen.personal.cr.aliyuncs.com
  IMAGE_NAMESPACE: cc4ever
  APP_NAME: web-qingce
  HOST_PORT: "3002"

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and build
        env:
          VITE_KEY_SECRET: ${{ secrets.VITE_KEY_SECRET }}
          VITE_STUDIO_PASSWORD: ${{ secrets.VITE_STUDIO_PASSWORD }}
        run: |
          npm ci
          npm test
          npm run build
          test -f dist/index.html

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: Build and push Docker image
        id: push
        run: |
          tag="${GITHUB_SHA:0:8}"
          image="${REGISTRY}/${IMAGE_NAMESPACE}/${APP_NAME}:${tag}"
          latest="${REGISTRY}/${IMAGE_NAMESPACE}/${APP_NAME}:latest"
          docker build -t "$image" -f script/Dockerfile .
          docker push "$image"
          docker tag "$image" "$latest"
          docker push "$latest"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  deploy-to-ecs:
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    environment: cc
    timeout-minutes: 20
    steps:
      - name: Deploy to Aliyun ECS via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE: ${{ needs.build-and-push-docker.outputs.image }}
          APP_NAME: ${{ env.APP_NAME }}
          HOST_PORT: ${{ env.HOST_PORT }}
          REGISTRY: ${{ env.REGISTRY }}
          ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          ALIYUN_DOCKER_PASSWORD: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.ECS_SSH_FINGERPRINT }}
          command_timeout: 15m
          version: "1.8.4"
          envs: IMAGE,APP_NAME,HOST_PORT,REGISTRY,ALIYUN_DOCKER_USERNAME,ALIYUN_DOCKER_PASSWORD
          script: |
            set -eu
            test -n "$REGISTRY"
            test -n "$IMAGE"
            test -n "$APP_NAME"
            test -n "$HOST_PORT"
            test -n "$ALIYUN_DOCKER_USERNAME"
            test -n "$ALIYUN_DOCKER_PASSWORD"
            printf '%s' "$ALIYUN_DOCKER_PASSWORD" | docker login --username "$ALIYUN_DOCKER_USERNAME" --password-stdin "$REGISTRY"
            docker pull "$IMAGE"
            docker stop "$APP_NAME" || true
            docker rm "$APP_NAME" || true
            docker run -d \
              -p "${HOST_PORT}:80" \
              --name "$APP_NAME" \
              --restart unless-stopped \
              "$IMAGE"
            docker network connect compose_default "$APP_NAME" || true
            status=$(docker inspect --format '{{.State.Status}}' "$APP_NAME")
            echo "$APP_NAME $status"
            test "$status" = "running"
            curl -fsS "http://127.0.0.1:${HOST_PORT}/" >/dev/null
