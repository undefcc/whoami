name: Build and Deploy to Aliyun ECS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: apps/ 下要部署的应用
        type: choice
        options:
          - qingce
        default: qingce

env:
  REGISTRY: crpi-zpvonb2nha7j0qgy.cn-shenzhen.personal.cr.aliyuncs.com
  IMAGE_NAMESPACE: cc4ever

jobs:
  resolve-app:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.map.outputs.app }}
      image_name: ${{ steps.map.outputs.image_name }}
      host_port: ${{ steps.map.outputs.host_port }}
    steps:
      - name: Map app to image and port
        id: map
        run: |
          app="${{ github.event.inputs.app || 'qingce' }}"
          case "$app" in
            qingce)
              echo "app=qingce" >> "$GITHUB_OUTPUT"
              echo "image_name=web-qingce" >> "$GITHUB_OUTPUT"
              echo "host_port=3200" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "未知应用: $app"
              exit 1
              ;;
          esac

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: resolve-app
    environment: cc
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install, test, and build
        env:
          VITE_KEY_SECRET: ${{ secrets.VITE_KEY_SECRET }}
          VITE_STUDIO_PASSWORD: ${{ secrets.VITE_STUDIO_PASSWORD }}
        run: |
          npm ci
          npm run test -w "${{ needs.resolve-app.outputs.app }}"
          npm run build -w "${{ needs.resolve-app.outputs.app }}"
          test -f "apps/${{ needs.resolve-app.outputs.app }}/dist/index.html"

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: Build and push Docker image
        id: push
        run: |
          tag="${GITHUB_SHA:0:8}"
          image="${REGISTRY}/${IMAGE_NAMESPACE}/${{ needs.resolve-app.outputs.image_name }}:${tag}"
          latest="${REGISTRY}/${IMAGE_NAMESPACE}/${{ needs.resolve-app.outputs.image_name }}:latest"
          docker build -t "$image" -f "apps/${{ needs.resolve-app.outputs.app }}/script/Dockerfile" .
          docker push "$image"
          docker tag "$image" "$latest"
          docker push "$latest"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  deploy-to-ecs:
    runs-on: ubuntu-latest
    needs: [resolve-app, build-and-push-docker]
    environment: cc
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Aliyun ECS via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE: ${{ needs.build-and-push-docker.outputs.image }}
          APP_NAME: ${{ needs.resolve-app.outputs.image_name }}
          HOST_PORT: ${{ needs.resolve-app.outputs.host_port }}
          REGISTRY: ${{ env.REGISTRY }}
          ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          ALIYUN_DOCKER_PASSWORD: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          command_timeout: 15m
          version: "1.8.4"
          envs: IMAGE,APP_NAME,HOST_PORT,REGISTRY,ALIYUN_DOCKER_USERNAME,ALIYUN_DOCKER_PASSWORD
          script: |
            set -eu
            test -n "$REGISTRY"
            test -n "$IMAGE"
            test -n "$APP_NAME"
            test -n "$HOST_PORT"
            test -n "$ALIYUN_DOCKER_USERNAME"
            test -n "$ALIYUN_DOCKER_PASSWORD"
            printf '%s' "$ALIYUN_DOCKER_PASSWORD" | docker login --username "$ALIYUN_DOCKER_USERNAME" --password-stdin "$REGISTRY"
            docker pull "$IMAGE"
            docker stop "$APP_NAME" || true
            docker rm "$APP_NAME" || true
            docker run -d \
              -p "${HOST_PORT}:80" \
              --name "$APP_NAME" \
              --restart unless-stopped \
              "$IMAGE"
            docker network connect compose_default "$APP_NAME" || true
            status=$(docker inspect --format '{{.State.Status}}' "$APP_NAME")
            echo "$APP_NAME $status"
            test "$status" = "running"
            curl -fsS "http://127.0.0.1:${HOST_PORT}/" >/dev/null

      - name: Point q.caelus.cc at web-qingce
        if: needs.resolve-app.outputs.app == 'qingce'
        uses: appleboy/ssh-action@v1.2.5
        env:
          ECS_PUBLIC_IP: ${{ secrets.ECS_HOST }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          command_timeout: 15m
          version: "1.8.4"
          envs: ECS_PUBLIC_IP
          script_path: apps/qingce/script/configure-domain.sh
